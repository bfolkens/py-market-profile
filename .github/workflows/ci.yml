name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.7)
    # setup-python provides Python 3.7 for Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.7'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
            tox.ini
      - name: Install tox
        run: python -m pip install tox
      - name: Run tests
        run: python -m tox -e py3 -v
